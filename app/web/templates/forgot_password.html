{% extends "base.html" %}
{% block title %}找回密码 · {{ app_name }}{% endblock %}
{% block page %}
<div class="gate solo">
  <section class="gate-card">
    <p class="eyebrow">Lost ticket · 补票</p>
    {% if message %}
    <div class="result-mark" aria-hidden="true">✓</div>
    <h2>请查收邮件</h2>
    <div class="notice success" role="status">{{ message }}</div>
    <p class="muted small">链接 60 分钟内有效，只能使用一次。没收到请检查垃圾邮件，或稍后重新申请。</p>
    {% else %}
    <h2>找回密码</h2>
    <p class="desc">输入注册邮箱，我们会发送一封带重置链接的邮件。</p>
    <form class="form" method="post" action="/forgot-password">
      <label class="field" for="email">邮箱<input id="email" type="email" name="email" autocomplete="email" required autofocus></label>
      <button class="btn primary block" type="submit" data-busy="发送中…">发送重置邮件</button>
    </form>
    {% endif %}
    <div class="foot"><a href="/login">← 返回登录</a><span>没有账户？<a href="/register">注册</a></span></div>
  </section>
</div>
{% endblock %}
