name: gateway checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements.lock
      - name: Install locked dependencies
        run: python -m pip install -r requirements.txt -c requirements.lock
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q app scripts tests
      - name: Import application
        run: python -c "from app.main import app; assert app.title"
      - name: Run regression tests
        run: python -m unittest discover -s tests
      - name: Build production container without publishing
        run: docker build --tag march7th-api:ci .
